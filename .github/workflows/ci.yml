name: Django CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: docker_backend
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: docker_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: docker_backend
          POSTGRES_USER: docker_user
          POSTGRES_PASSWORD: docker_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docker_user -d docker_backend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 1. Get project code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # 4. Run Django checks
      - name: Django checks
        run: |
          python manage.py check

      # 5. Run migrations
      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      # 6. Run tests
      - name: Run tests
        run: |
          python manage.py test

      # 7. Run linting
      - name: Run linting
        run: |
          flake8 . --exclude=.git,venv,__pycache__,migrations

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t docker-mobile-backend:ci .