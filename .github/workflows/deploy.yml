name: Deployment

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/voddetiharshitha-beep/docker-mobile-backend

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          python manage.py check

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          python manage.py test

      - name: Run flake8
        run: |
          flake8 . --exclude=.git,venv,__pycache__,migrations


  build-and-push:
    name: Docker Build and Registry
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deployment:
    name: Deployment Environment
    runs-on: ubuntu-latest
    needs: build-and-push

    environment:
      name: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deployment information
        run: |
          echo "Deployment environment: production"
          echo "Image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Commit: ${{ github.sha }}"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull deployment image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Verify deployment image
        run: |
          docker image inspect \
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            --format '{{.Os}}/{{.Architecture}}'

      - name: Start deployment container
        run: |
          docker run -d \
            --name docker-mobile-backend \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Wait for application
        run: |
          sleep 10

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://127.0.0.1:8000/api/health/

      - name: Deployment successful
        run: |
          echo "Deployment completed successfully."
          echo "Health check passed."
